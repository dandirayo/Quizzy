<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Sedang Kendala - Quizzy</title>
    <style>
        body {
            background-color: #0f0f1a;
            color: #f0f0f5;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1a1a2e;
            border: 1px solid #2d2d47;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.2rem; margin-bottom: 8px; color: #f0f0f5; }
        p { color: #9a9ab0; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            background: #8b5cf6;
            color: #fff;
            padding: 10px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 3.5rem; margin-bottom: 12px;">🛠️</div>
        <h1>50x Server Error</h1>
        <p>Layanan sedang dalam pemeliharaan berkala atau mengalami kendala sesaat. Silakan coba kembali dalam beberapa saat.</p>
        <a href="/" class="btn">Muat Ulang Halaman</a>
    </div>
</body>
</html>
