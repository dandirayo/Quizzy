name: Deploy to VPS

on:
  workflow_dispatch: # Jalankan secara manual saat ingin deploy ke VPS

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }} # Biasanya 22
          script: |
            set -e
            # Sesuai konvensi VPS, deploy ke /var/www/apps/<project-slug>
            cd /var/www/apps/Quizzy
            
            # Tarik pembaruan terbaru dari GitHub
            git pull origin main
            
            # Masuk ke folder app dan jalankan Docker Compose
            cd app
            docker compose up -d --build --remove-orphans
