<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Quiz refleksi diri Quizzy dengan hasil persentase per dimensi.">
<title>Quizzy — Quiz Refleksi Diri</title>
<link rel="stylesheet" href="quiz-engine.css">
</head>
<body>
<main class="container">
  <div class="card" id="appCard">
    <a href="index.html" class="home-link">← Beranda</a>
    <section class="screen active" id="screen-intro">
      <div class="logo" id="quizLogo"></div><h1 id="quizTitle"></h1><p class="subtitle" id="quizSubtitle"></p>
      <div class="dimension-preview" id="dimensionPreview"></div><div class="note" id="quizNote"></div>
      <button class="primary" id="startButton">Mulai Quiz</button>
    </section>
    <section class="screen" id="screen-quiz">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label"><span id="progressText"></span><span id="progressPct"></span></div>
      <div class="badge" id="dimensionBadge"></div><div class="question-text" id="questionText"></div><div class="options" id="options"></div>
      <div class="nav-row"><button class="secondary" id="backButton">← Kembali</button><button class="primary" id="nextButton" disabled>Lanjut →</button></div>
    </section>
    <section class="screen" id="screen-result">
      <div class="result-header"><div class="result-emoji" id="resultEmoji"></div><div class="result-title" id="resultTitle"></div><p class="result-tagline" id="resultTagline"></p></div>
      <div class="results" id="results"></div>
      <div class="insight-grid"><div class="insight"><h3>Pola Utamamu</h3><p id="dominantInsight"></p></div><div class="insight"><h3>Saran Praktis</h3><p id="practicalTip"></p></div></div>
      <div class="sources"><h3>Dasar Rujukan</h3><ul id="sourceList"></ul></div>
      <div class="result-actions"><button class="secondary" id="shareButton">Bagikan Hasil</button><button class="primary" id="restartButton">Ulangi Quiz</button></div>
    </section>
  </div>
</main>
<script src="quiz-catalog.js"></script>
<script src="quiz-engine.js"></script>
</body>
</html>
